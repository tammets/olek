name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: scripts/test.sh

      - name: Bundle release app
        run: scripts/bundle.sh release
